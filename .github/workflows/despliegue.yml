# Construye la imagen Docker y la publica en GitHub Container Registry
# cada vez que se hace push a la rama "despliegue".
name: Despliegue (imagen Docker)

on:
  push:
    branches: [despliegue]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  packages: write

concurrency:
  group: despliegue
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/porcoborracho/shamchester:despliegue
            ghcr.io/porcoborracho/shamchester:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Opcional: avisa a Portainer para que redespliegue en el momento.
      # Solo se ejecuta si existe el secreto PORTAINER_WEBHOOK_URL.
      - name: Avisar a Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
        run: curl -fsS -X POST "$PORTAINER_WEBHOOK_URL"
